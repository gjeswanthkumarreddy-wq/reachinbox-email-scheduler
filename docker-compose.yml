version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ReachInbox — Infrastructure Services
#
# Only infrastructure runs in Docker.
# The API, Worker, and Frontend run locally via `npm run dev:*` scripts.
#
# Usage:
#   docker-compose up -d          -> start all services in the background
#   docker-compose logs -f        -> tail logs
#   docker-compose down           -> stop (data persists in volumes)
#   docker-compose down -v        -> stop AND delete all volume data
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reachinbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reachinbox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 (AOF persistence enabled) ──────────────────────────────────────
  #
  # AOF (Append-Only File) ensures BullMQ delayed jobs survive a Redis restart.
  # Without it, all scheduled email jobs would be lost on restart,
  # violating requirement #9 (jobs must survive server restarts).
  #
  # appendfsync everysec: flush to disk every second — good balance of
  # durability vs. performance for development and small-scale production.
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Elasticsearch 8.13.0 ───────────────────────────────────────────────────
  #
  # Single-node setup with security disabled (suitable for development).
  # Memory capped at 512 MB to be friendly on developer machines.
  # Stores email_jobs index for full-text search across recipient/subject fields.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: reachinbox_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=reachinbox-cluster
      - node.name=reachinbox-node-1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — data persists across `docker-compose down` (not `down -v`)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: reachinbox_pg_data
  redis_data:
    name: reachinbox_redis_data
  es_data:
    name: reachinbox_es_data
